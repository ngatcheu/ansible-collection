---
# Type de base de données LDAP pour RedHat/CentOS (mdb = Memory-Mapped DB, défaut depuis OpenLDAP 2.5+)
dbtype: "{2}mdb"

# Chemin vers le fichier de configuration de la base de données
dbconfig_path: /usr/share/openldap-servers/DB_CONFIG.example

# Chemin vers les schémas LDAP
schema_path: /etc/openldap/schema
