---
- name: Créer le répertoire de configuration Pi-hole
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    mode: '0755'

- name: Créer le fichier de configuration automatique
  ansible.builtin.copy:
    dest: /etc/pihole/setupVars.conf
    mode: '0644'
    content: |
      PIHOLE_INTERFACE={{ pihole_interface }}
      PIHOLE_DNS_1={{ pihole_dns_1 }}
      PIHOLE_DNS_2={{ pihole_dns_2 }}
      QUERY_LOGGING=true
      INSTALL_WEB_SERVER=true
      INSTALL_WEB_INTERFACE=true
      LIGHTTPD_ENABLED=true
      CACHE_SIZE={{ pihole_cache_size }}
      DNS_FQDN_REQUIRED=false
      DNS_BOGUS_PRIV=true
      WEBPASSWORD=

- name: Télécharger le script d'installation Pi-hole
  ansible.builtin.get_url:
    url: https://install.pi-hole.net
    dest: /tmp/pihole-install.sh
    mode: '0755'

- name: Installer Pi-hole en mode non-interactif
  ansible.builtin.command:
    cmd: bash /tmp/pihole-install.sh --unattended
  environment:
    PIHOLE_SELINUX: "true"
  changed_when: true

- name: Définir le mot de passe admin
  ansible.builtin.command:
    cmd: pihole -a -p {{ pihole_password }}
  changed_when: true
  no_log: true
